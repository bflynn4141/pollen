name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production automation configuration
        run: node --test scripts/automation-config.test.mjs
      - run: pnpm test
      - run: pnpm build
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Verify contracts, Merkle vectors, fuzzing, and invariants
        working-directory: contracts
        run: |
          forge fmt --check src/PollenActiveRevenueVault.sol src/PollenSettlementV3.sol test/PollenActiveRevenueVault.t.sol test/PollenSettlementV3.t.sol test/PollenActiveRevenueVaultInvariant.t.sol script/DeployV3.s.sol
          forge build
          forge test --force
      - name: Verify publish artifact
        run: pnpm --filter @pollen/cli exec npm pack --dry-run --ignore-scripts
