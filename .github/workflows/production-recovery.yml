name: Production recovery

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Approved recovery operation'
        required: true
        type: choice
        options:
          - epoch-close
          - active-revenue-migration
          - active-revenue-shadow
      epoch:
        description: 'Just-closed epoch (required for epoch-close)'
        required: false
        type: string
      snapshot_block:
        description: 'Last Base block at or before the epoch boundary'
        required: false
        type: string
      pool_atomic:
        description: 'Shadow USDC pool in atomic units; zero is valid'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: pollen-production-recovery
  cancel-in-progress: false

jobs:
  epoch-close:
    if: ${{ inputs.action == 'epoch-close' }}
    runs-on: ubuntu-latest
    env:
      ADMIN_SECRET: ${{ secrets.WORKER_ADMIN_SECRET }}
    steps:
      - name: Validate requested epoch
        env:
          EPOCH: ${{ inputs.epoch }}
        run: |
          if [[ ! "${EPOCH}" =~ ^[0-9]+$ ]]; then
            echo "::error::epoch-close requires an integer epoch input"
            exit 1
          fi

      - name: Score the just-closed epoch
        env:
          EPOCH: ${{ inputs.epoch }}
        run: |
          response_file="$(mktemp)"
          status=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${ADMIN_SECRET}" \
            "https://pollen-api.bflynn4141.workers.dev/admin/run/epoch-close?epoch=${EPOCH}")
          jq . "${response_file}"
          if [[ "${status}" != "200" ]]; then
            echo "::error::epoch-close returned HTTP ${status}"
            exit 1
          fi

      - name: Read post-recovery health
        run: |
          response_file="$(mktemp)"
          status=$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${ADMIN_SECRET}" \
            https://pollen-api.bflynn4141.workers.dev/admin/health)
          jq . "${response_file}"
          if [[ "${status}" != "200" && "${status}" != "503" ]]; then
            echo "::error::health returned unexpected HTTP ${status}"
            exit 1
          fi

  active-revenue-migration:
    if: ${{ inputs.action == 'active-revenue-migration' }}
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply active-revenue schema transactionally
        run: |
          psql "${NEON_DATABASE_URL}" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file packages/site/migrations/013_active_revenue.sql

      - name: Verify active-revenue schema
        run: |
          psql "${NEON_DATABASE_URL}" --set=ON_ERROR_STOP=1 --tuples-only --command \
            "select table_name from information_schema.tables where table_schema = 'public' and table_name in ('active_revenue_distributions', 'active_revenue_claims') order by table_name;"

  active-revenue-shadow:
    if: ${{ inputs.action == 'active-revenue-shadow' }}
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      POLLEN_TOKEN_ADDRESS: ${{ secrets.POLLEN_TOKEN_ADDRESS }}
      BASE_RPC_URL: https://base-rpc.publicnode.com
      EPOCH: ${{ inputs.epoch }}
      SNAPSHOT_BLOCK: ${{ inputs.snapshot_block }}
      POOL_ATOMIC: ${{ inputs.pool_atomic }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate shadow inputs
        run: |
          if [[ ! "${EPOCH}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::active-revenue-shadow requires a positive integer epoch"
            exit 1
          fi
          if [[ ! "${SNAPSHOT_BLOCK}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::active-revenue-shadow requires a positive snapshot_block"
            exit 1
          fi
          if [[ ! "${POOL_ATOMIC}" =~ ^[0-9]+$ ]]; then
            echo "::error::pool_atomic must be a non-negative integer"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build active-revenue planner
        run: pnpm --filter @pollen/agent build

      - name: Generate read-only shadow artifact
        run: |
          node packages/agent/dist/main.js active-revenue-plan \
            --epoch "${EPOCH}" \
            --pool-atomic "${POOL_ATOMIC}" \
            --snapshot-block "${SNAPSHOT_BLOCK}"
